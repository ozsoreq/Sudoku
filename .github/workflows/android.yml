name: Build Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      # With a keystore secret: a signed release APK that updates in place.
      # Without one: a debug APK (fine for trying it out; reinstalls may be needed).
      - name: Build signed release APK
        if: env.KEYSTORE_BASE64 != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Sudoku.apk

      - name: Build debug APK
        if: env.KEYSTORE_BASE64 == ''
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Sudoku.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sudoku-apk
          path: Sudoku.apk

      # A release gives a direct download link that works from the phone's browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Sudoku for Android (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          files: Sudoku.apk
          make_latest: true
          body: |
            Download **Sudoku.apk** below on your Android phone and open it to install.
            Built from ${{ github.sha }}.
